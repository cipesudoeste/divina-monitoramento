services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: divina
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/divina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
      API_PORT: 4000
    depends_on: [postgres, redis]
    ports: ["4000:4000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["3000:3000"]
  worker:
    build:
      context: .
      dockerfile: apps/worker-wpp/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/divina
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis, api]
